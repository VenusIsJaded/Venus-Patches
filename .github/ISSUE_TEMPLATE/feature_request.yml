name: Feature request
description: Suggest one new feature or a change to an existing one.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Requests that explain what you'd do with a feature on your phone are the ones that get built.

        > [!IMPORTANT]
        > **One feature per request, and no pasted plugin lists.** Many desktop plugins (Vencord, BetterDiscord and others) rely on things the Discord app doesn't have, or already exist in Venus under another name. If a plugin inspired this, link it and say what it should do *on mobile*.

        Before you start, [search existing issues](https://github.com/VenusIsJaded/Venus-Patches/issues?q=is%3Aissue) and check the [features list](https://github.com/VenusIsJaded/Venus-Patches#features) in case it's already there.

  - type: textarea
    id: feature
    attributes:
      label: What should it do?
      description: Describe the feature, where it would show up in Discord, and how you'd use it. Mockups, screenshots or links help.
      placeholder: Hold a message and tap Copy text to pick part of it, instead of copying the whole message.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why do you want it?
      description: What problem does it solve for you? A clear reason matters more than anything else here.
    validations:
      required: true

  - type: input
    id: inspiration
    attributes:
      label: Based on an existing plugin? (optional)
      description: Link to the plugin, if there is one. Only the one this request is about.
      placeholder: https://github.com/…

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before you submit
      options:
        - label: I searched open and closed issues and the features list, and this isn't already there.
          required: true
        - label: This request is about one feature, not a list of plugins.
          required: true
